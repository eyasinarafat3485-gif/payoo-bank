<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo more practise</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- Tailwind and Daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">

    <header class="border-b-2 border-gray-300">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-3">
                <div class="logo w-[60px]">
                    <img src="assets/logo.png" alt="">
                </div>
                <div>
                    <h2 class="text-2xl font-bold">$ <span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="index.html" class="btn btn-outline text-neutral/50"><i
                        class="fa-solid fa-arrow-right-from-bracket"></i>Log Out</a>

            </div>

        </section>
    </header>

    <section class="w-11/12 mx-auto py-10 space-y-5">
        <h2 class="text-[30px] font-bold ">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
        <div class="buttons grid grid-cols-3 gap-3">
            <button onclick="showOnly('add-money')" class="btn flex flex-col h-full py-5 btn-primary btn-soft">
                <img src="assets/opt-1.png" alt="">
                <p class="text-[12px]">Add Money</p>
            </button>
            <button onclick="showOnly('cashout')" class="btn flex flex-col h-full py-5 btn-primary btn-soft">
                <img src="assets/opt-2.png" alt="">
                <p class="text-[12px]">Cashout</p>
            </button>
            <button onclick="showOnly('transfer')" class="btn flex flex-col h-full py-5 btn-primary btn-soft">
                <img src="assets/opt-3.png" alt="">
                <p class="text-[12px]">Transfer Money</p>
            </button>
            <button onclick="showOnly('get-bonus')" class="btn flex flex-col h-full py-5 btn-primary btn-soft">
                <img src="assets/opt-4.png" alt="">
                <p class="text-[12px]">Get Bonus</p>
            </button>
            <button onclick="showOnly('pay-bill')" class="btn flex flex-col h-full py-5 btn-primary btn-soft">
                <img src="assets/opt-5.png" alt="">
                <p class="text-[12px]">Pay Bill</p>
            </button>
            <button onclick="showOnly('history')" class="btn flex flex-col h-full py-5 btn-primary btn-soft">
                <img src="assets/opt-6.png" alt="">
                <p class="text-[12px]">Transactions</p>
            </button>
        </div>
        </div>

    </section>

    <!-- Add Money section -->
    <section id="add-money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Add Money</h2>
        <div class="form ">
            <div class="card bg-base-100 w-full max-w-full shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-semibold text-[20px]">Select A Bank</label>
                        <select id="add-money-bank"
                            class="select select-ghost w-full bg-base-200 rounded-full border-gray-300">
                            <option disabled selected>Just Select a Bank</option>
                            <option value="DDBL">DDBL</option>
                            <option value="IBBL">IBBL</option>
                            <option value="City-BanK">City Bank</option>
                        </select>
                        <br>

                        <label class="label text-neutral font-semibold text-[20px]">Bank Account Number</label>
                        <input id="add-money-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit Bank Ac number" />
                        <br>

                        <label class="label text-neutral font-semibold text-[20px]">Amount to Add</label>
                        <input id="add-money-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Add amount to withdraw" />
                        <br>

                        <label class="label text-neutral font-semibold text-[20px]">Pin Number</label>
                        <input id="add-money-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 digit pin number" />

                        <button id="btn-add-money" class="btn btn-primary rounded-full mt-4">Add Money </button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <!-- Cashout section -->
    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Cash Out</h2>
        <div class="form ">
            <div class="card bg-base-100 w-full max-w-full shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-semibold text-[20px]">Agent Number</label>
                        <input id="cashout-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-full bg-base-200 w-full" value="01234567890"
                            placeholder="Enter 11 digit number" />
                        <br>
                        <label class="label text-neutral font-semibold text-[20px]">Amount</label>
                        <input id="cashout-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter amount to withdraw" />
                        <br>
                        <label class="label text-neutral font-semibold text-[20px]">Pin Number</label>
                        <input id="cashout-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 digit pin number" />

                        <button id="btn-cashout" class="btn btn-primary rounded-full mt-4">Withdraw Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <!-- Transfer Money section -->
    <section id="transfer" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Transfer Money</h2>
        <div class="form ">
            <div class="card bg-base-100 w-full max-w-full shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-semibold text-[20px]">User Account Number</label>
                        <input id="transfer-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-full bg-base-200 w-full" value="01234567890"
                            placeholder="Enter 11 digit number" />
                        <br>
                        <label class="label text-neutral font-semibold text-[20px]">Amount</label>
                        <input id="transfer-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter amount to transfer" />
                        <br>
                        <label class="label text-neutral font-semibold text-[20px]">Pin Number</label>
                        <input id="transfer-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 digit pin number" />

                        <button id="btn-transfer" class="btn btn-primary rounded-full mt-4">Send Now</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <!-- get bonus section -->
     <section id="get-bonus" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Get Bonus</h2>
        <div class="form ">
            <div class="card bg-base-100 w-full max-w-full shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">

                        <label class="label text-neutral font-semibold text-[20px]">Enter Bonus Coupon</label>
                        <input id="get-bonus-number" maxlength="11" minlength="11" type="number" class="input rounded-full bg-base-200 w-full" value="01234567890"
                            placeholder="Enter your coupon" />
                        <br>

                        <button id="btn-get-bonus" class="btn btn-primary rounded-full mt-4">Get Bonus</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <!-- Pay Bill section -->
    <section id="pay-bill" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Pay Bill</h2>
        <div class="form ">
            <div class="card bg-base-100 w-full max-w-full shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-semibold text-[20px]">Select to Pay</label>
                        <select id="pay-bill-bank"
                            class="select select-ghost w-full bg-base-200 rounded-full border-gray-300">
                            <option disabled selected>Select bank</option>
                            <option value="DDBL">DDBL</option>
                            <option value="IBBL">IBBL</option>
                            <option value="City-BanK">City Bank</option>
                        </select>
                        <br>

                        <label class="label text-neutral font-semibold text-[20px]">Biller Account
                            Number</label>
                        <input id="pay-bill-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-full bg-base-200 w-full"
                            placeholder="Enter 11 digit bank account number" />
                        <br>

                        <label class="label text-neutral font-semibold text-[20px]">Amount to Pay</label>
                        <input id="pay-bill-amount" type="number" class="input rounded-full bg-base-200 w-full"
                            placeholder="Add amount to pay" />
                        <br>

                        <label class="label text-neutral font-semibold text-[20px]">Pin Number</label>
                        <input id="pay-bill-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 digit pin number" />

                        <button id="btn-pay-bill" class="btn btn-primary rounded-full mt-4">Add Money </button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>



    <!-- Transactions sectiion -->
    <section id="history" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Transactions</h2>
        <div id="history-container" class="space-y-5">

    </section>


    <script src="script/machine.js"></script>
    <script src="script/addMoney.js"></script>
    <script src="script/cashout2.js"></script>
    <script src="script/transfer.js"></script>
    <script src="script/get-bonus.js"></script>
    <script src="script/paybill.js"></script>

</body>

</html>
